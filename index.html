<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผงหวยออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; } </style>
</head>
<body class="pb-24">
    <!-- Header -->
    <header class="bg-teal-600 text-white p-4 shadow-md sticky top-0 z-40">
        <h1 class="text-xl font-bold text-center">หวยเงินล้าน</h1>
        <div class="mt-3">
            <input type="text" id="searchInput" placeholder="🔍 ค้นหาเลขสลาก (เช่น 123)" class="w-full p-2 rounded text-black outline-none">
        </div>
    </header>

    <!-- Ticket Grid -->
    <div class="container mx-auto p-4">
        <div id="ticket-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <p class="col-span-2 text-center text-gray-500 py-10">กำลังโหลดแผงหวย...</p>
        </div>
    </div>

    <!-- Cart (Sticky Bottom) -->
    <div id="cart-bar" class="fixed bottom-0 left-0 w-full bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 flex justify-between items-center hidden z-30">
        <div>
            <p class="text-sm text-gray-600">เลือกแล้ว <span id="cart-count" class="font-bold text-teal-600">0</span> ใบ</p>
            <p class="text-lg font-bold">รวม <span id="cart-total">0</span> บาท</p>
        </div>
        <button onclick="openCheckout()" class="bg-teal-600 text-white px-6 py-2 rounded-lg font-bold text-lg shadow-md">แจ้งซื้อเลย</button>
    </div>

    <!-- Image Modal (ป๊อปอัปดูรูปเต็มใบ) -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center hidden z-[60] cursor-pointer" onclick="closeImageModal()">
        <span class="absolute top-4 right-4 text-white text-4xl font-bold">&times;</span>
        <img id="modal-image" class="max-w-[95%] max-h-[90vh] object-contain rounded-lg shadow-2xl">
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-xl w-11/12 max-w-md">
            <h2 class="text-xl font-bold mb-4">ข้อมูลผู้ซื้อ</h2>
            <input type="text" id="buyer-name" placeholder="ชื่อ / ชื่อเล่น" class="w-full p-3 border rounded mb-3 outline-none focus:border-teal-500">
            <input type="tel" id="buyer-phone" placeholder="เบอร์โทรศัพท์" class="w-full p-3 border rounded mb-4 outline-none focus:border-teal-500">
            <div class="flex gap-2">
                <button onclick="closeModal('checkout-modal')" class="w-1/3 bg-gray-300 py-2 rounded font-bold">ยกเลิก</button>
                <button onclick="confirmOrder()" class="w-2/3 bg-teal-600 text-white py-2 rounded font-bold" id="btn-confirm">ยืนยันคำสั่งซื้อ</button>
            </div>
        </div>
    </div>

    <!-- Payment & Slip Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-xl w-11/12 max-w-md text-center relative">
            
            <button onclick="cancelPayment()" class="absolute top-2 right-4 text-gray-400 hover:text-red-500 text-3xl font-bold leading-none">&times;</button>
            
            <h2 class="text-xl font-bold text-red-600 mb-2 mt-2">⏱ เหลือเวลา <span id="timer">05:00</span></h2>
            <p class="mb-4 text-gray-600 text-sm">กรุณาโอนเงินและแนบสลิปเพื่อยืนยัน</p>
            
            <div class="bg-gray-50 p-4 rounded-lg mb-4 border">
                <p class="font-bold text-lg">ยอดโอน: <span id="pay-total" class="text-teal-600">0</span> บาท</p>
                
                <!-- โซนแสดง พร้อมเพย์ และ QR Code -->
                <div id="qr-container" class="mt-4 hidden border-t pt-4">
                    <!-- ข้อความพร้อมเพย์ (แสดงผลเมื่อแอดมินตั้งค่า) -->
                    <p id="promptpay-display" class="font-bold text-blue-700 mb-3 text-lg hidden"></p>
                    
                    <p id="qr-hint" class="text-xs text-gray-500 mb-2 font-bold hidden">สแกน QR Code เพื่อโอนเงิน (คลิกเพื่อขยาย)</p>
                    <img id="qr-image" src="" class="w-32 h-32 mx-auto rounded-lg shadow-sm border border-gray-300 cursor-pointer object-cover hidden" onclick="openImageModal(event, this.src)">
                </div>
            </div>

            <label class="block w-full bg-blue-100 text-blue-700 p-3 rounded cursor-pointer font-bold mb-4 border border-blue-300 hover:bg-blue-200 transition">
                📸 อัปโหลดสลิปโอนเงิน
                <input type="file" id="slip-file" accept="image/*" class="hidden" onchange="handleSlipSelect(event)">
            </label>
            <p id="slip-name" class="text-sm text-green-600 mb-4 font-bold hidden">อัปโหลดสลิปแล้ว!</p>

            <button onclick="submitPayment()" id="btn-submit-slip" class="w-full bg-teal-600 text-white py-3 rounded-lg font-bold text-lg shadow-md opacity-50 pointer-events-none transition">แจ้งโอนเงิน</button>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, writeBatch, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXuj7Pl1JnBn2Y7BtyzkHHQm4MQH-isrM",
            authDomain: "time-attendance-69699.firebaseapp.com",
            projectId: "time-attendance-69699",
            storageBucket: "time-attendance-69699.firebasestorage.app",
            messagingSenderId: "793986547170",
            appId: "1:793986547170:web:337bfe602d9b3e32f34dbb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allTickets = [];
        let cart = [];
        let compressedSlip = null;
        let countdownTimer;

        // ดึงการตั้งค่าร้าน (พร้อมเพย์ & QR) มาแสดง
        onSnapshot(doc(db, "store_settings", "payment_info"), (docSnap) => {
            if(docSnap.exists()) {
                const data = docSnap.data();
                let hasData = false;

                if(data.promptpay_text && data.promptpay_text.trim() !== '') {
                    document.getElementById('promptpay-display').innerText = data.promptpay_text;
                    document.getElementById('promptpay-display').classList.remove('hidden');
                    hasData = true;
                } else {
                    document.getElementById('promptpay-display').classList.add('hidden');
                }

                if(data.qr_base64) {
                    document.getElementById('qr-image').src = data.qr_base64;
                    document.getElementById('qr-image').classList.remove('hidden');
                    document.getElementById('qr-hint').classList.remove('hidden');
                    hasData = true;
                } else {
                    document.getElementById('qr-image').classList.add('hidden');
                    document.getElementById('qr-hint').classList.add('hidden');
                }

                if(hasData) {
                    document.getElementById('qr-container').classList.remove('hidden');
                } else {
                    document.getElementById('qr-container').classList.add('hidden');
                }
            }
        });

        window.compressImage = function(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        };

        onSnapshot(collection(db, "lottery_tickets"), (snapshot) => {
            allTickets = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if(data.status === 'RESERVED' && (Date.now() - data.reserved_at > 300000)) {
                    data.status = 'AVAILABLE'; 
                }
                allTickets.push({ id: docSnap.id, ...data });
            });
            renderTickets();
        });

        function renderTickets() {
            const grid = document.getElementById('ticket-grid');
            const keyword = document.getElementById('searchInput').value;
            grid.innerHTML = '';
            
            const availableTickets = allTickets.filter(t => t.status === 'AVAILABLE' && t.ticket_no.includes(keyword));
            
            if(availableTickets.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-5">ไม่มีสลากว่างที่ค้นหา</p>';
                return;
            }

            availableTickets.forEach(ticket => {
                const isSelected = cart.find(item => item.id === ticket.id);
                // จัดรูปแบบป้ายราคา
                const priceTag = ticket.price ? `<p class="font-bold text-teal-600 mt-1">${ticket.price} บาท</p>` : '';
                
                grid.innerHTML += `
                    <div class="bg-white rounded-lg shadow-sm border ${isSelected ? 'border-4 border-teal-500' : 'border-gray-200'} overflow-hidden relative cursor-pointer flex flex-col" onclick="toggleCart('${ticket.id}')">
                        ${isSelected ? '<div class="absolute top-0 right-0 bg-teal-500 text-white text-xs px-2 py-1 rounded-bl-lg font-bold z-10 pointer-events-none">เลือกแล้ว</div>' : ''}
                        
                        <img src="${ticket.image_base64}" class="w-full h-24 object-cover relative z-20" alt="หวย" onclick="openImageModal(event, '${ticket.image_base64}')">
                        
                        <!-- นำตัวเลขออกตามที่ขอ เหลือแค่ราคาตรงกลาง -->
                        <div class="p-2 text-center flex-1 flex flex-col justify-center">
                            ${priceTag}
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('searchInput').addEventListener('input', renderTickets);

        window.openImageModal = function(event, src) {
            event.stopPropagation();
            document.getElementById('modal-image').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
        };

        window.closeImageModal = function() {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('modal-image').src = '';
        };

        window.toggleCart = function(id) {
            const ticket = allTickets.find(t => t.id === id);
            const index = cart.findIndex(t => t.id === id);
            if (index > -1) cart.splice(index, 1);
            else cart.push(ticket);
            
            updateCartUI();
            renderTickets();
        };

        function updateCartUI() {
            const cartBar = document.getElementById('cart-bar');
            if (cart.length > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('cart-count').innerText = cart.length;
                const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
                document.getElementById('cart-total').innerText = total;
            } else {
                cartBar.classList.add('hidden');
            }
        }

        window.openCheckout = () => document.getElementById('checkout-modal').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById('checkout-modal').classList.add('hidden');

        window.confirmOrder = async function() {
            const name = document.getElementById('buyer-name').value;
            const phone = document.getElementById('buyer-phone').value;
            if(!name || !phone) return alert("กรุณากรอกชื่อและเบอร์โทรให้ครบถ้วน");

            document.getElementById('btn-confirm').innerText = "กำลังล็อคสลาก...";
            try {
                const batch = writeBatch(db);
                for (let item of cart) {
                    const docSnap = await getDoc(doc(db, "lottery_tickets", item.id));
                    const dbData = docSnap.data();
                    if(dbData.status !== 'AVAILABLE' && !(dbData.status === 'RESERVED' && (Date.now() - dbData.reserved_at > 300000))) {
                        throw new Error(`ใบเลข ${item.ticket_no} ถูกซื้อไปแล้ว กรุณาเลือกใหม่`);
                    }
                    batch.update(doc(db, "lottery_tickets", item.id), { 
                        status: 'RESERVED', 
                        reserved_at: Date.now(),
                        buyer_name: name
                    });
                }
                await batch.commit(); 

                document.getElementById('checkout-modal').classList.add('hidden');
                document.getElementById('payment-modal').classList.remove('hidden');
                
                const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
                document.getElementById('pay-total').innerText = total;
                startTimer(300); 

            } catch (e) {
                alert(e.message);
                document.getElementById('btn-confirm').innerText = "ยืนยันคำสั่งซื้อ";
            }
        };

        window.cancelPayment = async function() {
            if(!confirm("ต้องการยกเลิกการสั่งซื้อและคืนสลากกลับขึ้นแผงใช่หรือไม่?")) return;
            
            clearInterval(countdownTimer);
            document.getElementById('payment-modal').classList.add('hidden');
            
            try {
                const batch = writeBatch(db);
                cart.forEach(item => {
                    batch.update(doc(db, "lottery_tickets", item.id), { 
                        status: 'AVAILABLE',
                        reserved_at: 0,
                        buyer_name: ""
                    });
                });
                await batch.commit(); 

                cart = [];
                updateCartUI();
                renderTickets();
                alert("ยกเลิกรายการสำเร็จ สลากถูกนำกลับขึ้นแผงแล้วค่ะ");
            } catch (e) {
                console.error(e);
                alert("เกิดข้อผิดพลาดในการยกเลิก");
            }
        };

        window.handleSlipSelect = function(e) {
            const file = e.target.files[0];
            if(!file) return;
            compressImage(file, (base64) => {
                compressedSlip = base64;
                document.getElementById('slip-name').classList.remove('hidden');
                document.getElementById('btn-submit-slip').classList.remove('opacity-50', 'pointer-events-none');
            });
        };

        window.submitPayment = async function() {
            if(!compressedSlip) return;
            document.getElementById('btn-submit-slip').innerText = "กำลังส่งข้อมูล...";
            const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
            
            try {
                await addDoc(collection(db, "lottery_orders"), {
                    buyer_name: document.getElementById('buyer-name').value,
                    buyer_phone: document.getElementById('buyer-phone').value,
                    total_price: total,
                    slip_base64: compressedSlip,
                    tickets: cart.map(t => ({ id: t.id, no: t.ticket_no })),
                    status: 'PAYMENT_REVIEW',
                    created_at: serverTimestamp()
                });

                const batch = writeBatch(db);
                cart.forEach(item => {
                    batch.update(doc(db, "lottery_tickets", item.id), { status: 'PAYMENT_REVIEW' });
                });
                await batch.commit();

                alert("แจ้งโอนเงินสำเร็จ! กรุณารอแอดมินตรวจสอบ");
                location.reload(); 
            } catch(e) {
                console.error(e);
                alert("เกิดข้อผิดพลาดในการแจ้งโอน");
            }
        };

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            countdownTimer = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                document.getElementById('timer').textContent = minutes + ":" + seconds;
                if (--timer < 0) {
                    clearInterval(countdownTimer);
                    alert("หมดเวลาทำรายการ สลากถูกนำกลับขึ้นแผง");
                    location.reload();
                }
            }, 1000);
        }
    </script>
</body>
</html>
