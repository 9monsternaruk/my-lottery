<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผงหวยออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; } 
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="pb-28">
    <!-- Header (ธีมสีแดงกระตุ้นโชคลาภ) -->
    <header class="bg-gradient-to-b from-red-600 to-red-700 text-white pt-5 pb-10 px-4 shadow-md sticky top-0 z-20 rounded-b-2xl">
        <div class="flex justify-center items-center gap-2">
            <span class="text-2xl">🐉</span>
            <h1 class="text-xl font-bold text-center tracking-wide">ซื้อแล้วรวย หวยเงินล้าน</h1>
        </div>
    </header>

    <!-- Search Section (การ์ดค้นหาลอยทับ Header) -->
    <div class="bg-white p-4 mx-4 -mt-6 relative z-30 rounded-xl shadow-lg border border-gray-100">
        <h2 class="text-sm font-bold text-gray-800 mb-2 flex items-center gap-1">
            <span>🔍</span> ค้นหาเลขเด็ดรางวัลที่ 1
        </h2>
        <input type="number" id="searchInput" placeholder="พิมพ์เลขที่ต้องการค้นหา..." class="w-full p-3 border border-gray-300 rounded-lg text-center font-bold text-lg outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-gray-50 transition">
        
        <div class="mt-3">
            <button onclick="randomTicket()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 shadow-sm transition">
                ✨ สุ่มตัวเลขโชคดี
            </button>
        </div>
    </div>

    <!-- Ticket Grid -->
    <div class="container mx-auto p-4 mt-2">
        <div class="flex justify-between items-end mb-3 px-1">
            <h3 class="font-bold text-gray-800 border-l-4 border-red-600 pl-2">สลากทั้งหมด</h3>
            <span id="ticket-count" class="text-xs text-gray-500 font-bold">กำลังโหลด...</span>
        </div>

        <div id="ticket-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
            <p class="col-span-2 text-center text-gray-500 py-10">กำลังโหลดแผงหวย...</p>
        </div>
    </div>

    <!-- Cart (Sticky Bottom แบบขอบโค้งแอปพลิเคชัน) -->
    <div id="cart-bar" class="fixed bottom-0 left-0 w-full bg-white shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.15)] p-4 flex justify-between items-center hidden z-30 rounded-t-2xl border-t border-gray-100">
        <div>
            <p class="text-xs text-gray-500 font-bold mb-0.5">🛒 ตะกร้าของคุณ</p>
            <p class="text-lg font-bold text-slate-800">
                <span id="cart-count" class="text-red-600">0</span> ใบ 
                <span class="text-gray-300 font-normal mx-1">|</span> 
                <span id="cart-total" class="text-red-600">0</span> ฿
            </p>
        </div>
        <button onclick="openCheckout()" class="bg-gradient-to-r from-red-600 to-red-500 text-white px-8 py-3 rounded-full font-bold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition">แจ้งซื้อเลย</button>
    </div>

    <!-- Image Modal (ป๊อปอัปดูรูปเต็มใบ) -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center hidden z-[60] cursor-pointer backdrop-blur-sm" onclick="closeImageModal()">
        <span class="absolute top-4 right-4 text-white text-4xl font-bold drop-shadow-md">&times;</span>
        <img id="modal-image" class="max-w-[95%] max-h-[90vh] object-contain rounded-lg shadow-2xl">
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl w-11/12 max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-slate-800 border-b pb-2">📋 ข้อมูลผู้ซื้อ</h2>
            <input type="text" id="buyer-name" placeholder="ชื่อ / ชื่อเล่น" class="w-full p-3 border border-gray-300 rounded-xl mb-3 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-gray-50">
            <input type="tel" id="buyer-phone" placeholder="เบอร์โทรศัพท์" class="w-full p-3 border border-gray-300 rounded-xl mb-5 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 bg-gray-50">
            <div class="flex gap-3">
                <button onclick="closeModal('checkout-modal')" class="w-1/3 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="confirmOrder()" class="w-2/3 bg-red-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-red-700 transition" id="btn-confirm">ยืนยันคำสั่งซื้อ</button>
            </div>
        </div>
    </div>

    <!-- Payment & Slip Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl w-11/12 max-w-md text-center relative shadow-2xl">
            
            <button onclick="cancelPayment()" class="absolute top-3 right-4 text-gray-400 hover:text-red-600 text-3xl font-bold leading-none transition">&times;</button>
            
            <div class="bg-red-50 text-red-600 inline-block px-4 py-1 rounded-full font-bold text-lg mb-2 mt-2 border border-red-100">
                ⏱ <span id="timer">05:00</span>
            </div>
            <p class="mb-4 text-gray-600 text-sm">กรุณาโอนเงินและแนบสลิปเพื่อยืนยัน</p>
            
            <div class="bg-gray-50 p-4 rounded-xl mb-4 border border-gray-100 shadow-inner">
                <p class="font-bold text-gray-700">ยอดชำระ: <span id="pay-total" class="text-2xl text-red-600 ml-1">0</span> บาท</p>
                
                <div id="qr-container" class="mt-4 hidden border-t border-gray-200 pt-4">
                    <p id="promptpay-display" class="font-bold text-slate-800 mb-3 text-lg hidden bg-white py-2 rounded-lg shadow-sm border border-gray-100"></p>
                    <p id="qr-hint" class="text-xs text-gray-500 mb-2 font-bold hidden">สแกน QR Code (แตะเพื่อขยาย)</p>
                    <img id="qr-image" src="" class="w-36 h-36 mx-auto rounded-xl shadow-md border border-gray-200 cursor-pointer object-cover hidden hover:scale-105 transition-transform" onclick="openImageModal(event, this.src)">
                </div>
            </div>

            <label class="block w-full bg-slate-800 text-white p-3.5 rounded-xl cursor-pointer font-bold mb-4 shadow-md hover:bg-slate-700 transition">
                📸 อัปโหลดรูปสลิปโอนเงิน
                <input type="file" id="slip-file" accept="image/*" class="hidden" onchange="handleSlipSelect(event)">
            </label>
            <p id="slip-name" class="text-sm text-green-600 mb-4 font-bold hidden">✅ แนบสลิปเรียบร้อยแล้ว!</p>

            <button onclick="submitPayment()" id="btn-submit-slip" class="w-full bg-gradient-to-r from-red-600 to-red-500 text-white py-3.5 rounded-xl font-bold text-lg shadow-lg opacity-50 pointer-events-none transition">แจ้งโอนเงิน</button>
        </div>
    </div>

    <!-- Firebase Logic (คงเดิม 100%) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, writeBatch, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXuj7Pl1JnBn2Y7BtyzkHHQm4MQH-isrM",
            authDomain: "time-attendance-69699.firebaseapp.com",
            projectId: "time-attendance-69699",
            storageBucket: "time-attendance-69699.firebasestorage.app",
            messagingSenderId: "793986547170",
            appId: "1:793986547170:web:337bfe602d9b3e32f34dbb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allTickets = [];
        let cart = [];
        let compressedSlip = null;
        let countdownTimer;

        onSnapshot(doc(db, "store_settings", "payment_info"), (docSnap) => {
            if(docSnap.exists()) {
                const data = docSnap.data();
                let hasData = false;

                if(data.promptpay_text && data.promptpay_text.trim() !== '') {
                    document.getElementById('promptpay-display').innerText = data.promptpay_text;
                    document.getElementById('promptpay-display').classList.remove('hidden');
                    hasData = true;
                } else {
                    document.getElementById('promptpay-display').classList.add('hidden');
                }

                if(data.qr_base64) {
                    document.getElementById('qr-image').src = data.qr_base64;
                    document.getElementById('qr-image').classList.remove('hidden');
                    document.getElementById('qr-hint').classList.remove('hidden');
                    hasData = true;
                } else {
                    document.getElementById('qr-image').classList.add('hidden');
                    document.getElementById('qr-hint').classList.add('hidden');
                }

                if(hasData) {
                    document.getElementById('qr-container').classList.remove('hidden');
                } else {
                    document.getElementById('qr-container').classList.add('hidden');
                }
            }
        });

        window.compressImage = function(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        };

        onSnapshot(collection(db, "lottery_tickets"), (snapshot) => {
            allTickets = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if(data.status === 'RESERVED' && (Date.now() - data.reserved_at > 300000)) {
                    data.status = 'AVAILABLE'; 
                }
                allTickets.push({ id: docSnap.id, ...data });
            });
            renderTickets();
        });

        function renderTickets() {
            const grid = document.getElementById('ticket-grid');
            const keyword = document.getElementById('searchInput').value;
            grid.innerHTML = '';
            
            const availableTickets = allTickets.filter(t => t.status === 'AVAILABLE' && t.ticket_no.includes(keyword));
            
            document.getElementById('ticket-count').innerText = `มี ${availableTickets.length} ใบ`;
            
            if(availableTickets.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 md:col-span-4 text-center py-12 bg-white rounded-xl shadow-sm border border-gray-100">
                        <span class="text-4xl">📭</span>
                        <p class="text-gray-500 mt-2 font-bold">ไม่มีสลากว่างที่ค้นหา</p>
                    </div>`;
                return;
            }

            availableTickets.forEach(ticket => {
                const isSelected = cart.find(item => item.id === ticket.id);
                
                // รูปแบบใหม่: จัดการสีปุ่มและเส้นขอบตามสถานะการเลือก
                const borderClass = isSelected ? 'border-2 border-green-500 shadow-md' : 'border border-gray-200 shadow-sm';
                const btnClass = isSelected ? 'bg-green-500 text-white' : 'bg-red-600 text-white hover:bg-red-700';
                const btnText = isSelected ? '✅ เลือกแล้ว' : '🛒 หยิบใส่ตะกร้า';
                
                const priceTag = ticket.price ? `<p class="font-bold text-slate-700 text-sm mb-2">${ticket.price} บาท</p>` : `<p class="text-xs text-transparent mb-2">-</p>`;
                
                grid.innerHTML += `
                    <div class="bg-white rounded-xl ${borderClass} overflow-hidden flex flex-col transition-all">
                        <!-- รูปสลาก -->
                        <div class="relative">
                            <img src="${ticket.image_base64}" class="w-full h-24 md:h-32 object-cover cursor-pointer hover:opacity-90 transition" alt="หวย" onclick="openImageModal(event, '${ticket.image_base64}')">
                        </div>
                        
                        <!-- โซนปุ่มหยิบใส่ตะกร้า (ไม่มีตัวเลขตามที่ขอ) -->
                        <div class="p-2.5 text-center flex-1 flex flex-col justify-end bg-gray-50/50">
                            ${priceTag}
                            <button onclick="toggleCart('${ticket.id}')" class="w-full py-1.5 rounded-lg text-sm font-bold shadow-sm ${btnClass} transition-colors">
                                ${btnText}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('searchInput').addEventListener('input', renderTickets);

        // ฟังก์ชันสุ่มตัวเลข (เพิ่มใหม่)
        window.randomTicket = function() {
            const availableTickets = allTickets.filter(t => t.status === 'AVAILABLE');
            if (availableTickets.length === 0) {
                return alert("ขออภัยครับ ขณะนี้ไม่มีสลากว่างในแผง");
            }
            // สุ่มเลือก 1 ใบ
            const randomIndex = Math.floor(Math.random() * availableTickets.length);
            const randomTicket = availableTickets[randomIndex];
            
            // นำเลขที่สุ่มได้ไปใส่ในช่องค้นหา
            document.getElementById('searchInput').value = randomTicket.ticket_no;
            renderTickets();
        };

        window.openImageModal = function(event, src) {
            event.stopPropagation();
            document.getElementById('modal-image').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
        };

        window.closeImageModal = function() {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('modal-image').src = '';
        };

        window.toggleCart = function(id) {
            const ticket = allTickets.find(t => t.id === id);
            const index = cart.findIndex(t => t.id === id);
            if (index > -1) cart.splice(index, 1);
            else cart.push(ticket);
            
            updateCartUI();
            renderTickets();
        };

        function updateCartUI() {
            const cartBar = document.getElementById('cart-bar');
            if (cart.length > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('cart-count').innerText = cart.length;
                const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
                document.getElementById('cart-total').innerText = total.toLocaleString();
            } else {
                cartBar.classList.add('hidden');
            }
        }

        window.openCheckout = () => document.getElementById('checkout-modal').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById('checkout-modal').classList.add('hidden');

        window.confirmOrder = async function() {
            const name = document.getElementById('buyer-name').value;
            const phone = document.getElementById('buyer-phone').value;
            if(!name || !phone) return alert("กรุณากรอกชื่อและเบอร์โทรให้ครบถ้วน");

            document.getElementById('btn-confirm').innerText = "กำลังล็อคสลาก...";
            document.getElementById('btn-confirm').classList.add('opacity-70', 'pointer-events-none');

            try {
                const batch = writeBatch(db);
                for (let item of cart) {
                    const docSnap = await getDoc(doc(db, "lottery_tickets", item.id));
                    const dbData = docSnap.data();
                    if(dbData.status !== 'AVAILABLE' && !(dbData.status === 'RESERVED' && (Date.now() - dbData.reserved_at > 300000))) {
                        throw new Error(`ใบเลข ${item.ticket_no} ถูกซื้อไปแล้ว กรุณาเลือกใหม่`);
                    }
                    batch.update(doc(db, "lottery_tickets", item.id), { 
                        status: 'RESERVED', 
                        reserved_at: Date.now(),
                        buyer_name: name
                    });
                }
                await batch.commit(); 

                document.getElementById('checkout-modal').classList.add('hidden');
                document.getElementById('payment-modal').classList.remove('hidden');
                
                const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
                document.getElementById('pay-total').innerText = total.toLocaleString();
                startTimer(300); 

            } catch (e) {
                alert(e.message);
                document.getElementById('btn-confirm').innerText = "ยืนยันคำสั่งซื้อ";
                document.getElementById('btn-confirm').classList.remove('opacity-70', 'pointer-events-none');
            }
        };

        window.cancelPayment = async function() {
            if(!confirm("ต้องการยกเลิกการสั่งซื้อและคืนสลากกลับขึ้นแผงใช่หรือไม่?")) return;
            
            clearInterval(countdownTimer);
            document.getElementById('payment-modal').classList.add('hidden');
            
            try {
                const batch = writeBatch(db);
                cart.forEach(item => {
                    batch.update(doc(db, "lottery_tickets", item.id), { 
                        status: 'AVAILABLE',
                        reserved_at: 0,
                        buyer_name: ""
                    });
                });
                await batch.commit(); 

                cart = [];
                updateCartUI();
                renderTickets();
                
                // รีเซ็ตฟอร์ม
                document.getElementById('btn-confirm').innerText = "ยืนยันคำสั่งซื้อ";
                document.getElementById('btn-confirm').classList.remove('opacity-70', 'pointer-events-none');
                
            } catch (e) {
                console.error(e);
                alert("เกิดข้อผิดพลาดในการยกเลิก");
            }
        };

        window.handleSlipSelect = function(e) {
            const file = e.target.files[0];
            if(!file) return;
            compressImage(file, (base64) => {
                compressedSlip = base64;
                document.getElementById('slip-name').classList.remove('hidden');
                document.getElementById('btn-submit-slip').classList.remove('opacity-50', 'pointer-events-none');
            });
        };

        window.submitPayment = async function() {
            if(!compressedSlip) return;
            document.getElementById('btn-submit-slip').innerText = "กำลังส่งข้อมูล...";
            const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
            
            try {
                await addDoc(collection(db, "lottery_orders"), {
                    buyer_name: document.getElementById('buyer-name').value,
                    buyer_phone: document.getElementById('buyer-phone').value,
                    total_price: total,
                    slip_base64: compressedSlip,
                    tickets: cart.map(t => ({ id: t.id, no: t.ticket_no })),
                    status: 'PAYMENT_REVIEW',
                    created_at: serverTimestamp()
                });

                const batch = writeBatch(db);
                cart.forEach(item => {
                    batch.update(doc(db, "lottery_tickets", item.id), { status: 'PAYMENT_REVIEW' });
                });
                await batch.commit();

                alert("แจ้งโอนเงินสำเร็จ! กรุณารอแอดมินตรวจสอบ");
                location.reload(); 
            } catch(e) {
                console.error(e);
                alert("เกิดข้อผิดพลาดในการแจ้งโอน");
            }
        };

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            countdownTimer = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                document.getElementById('timer').textContent = minutes + ":" + seconds;
                if (--timer < 0) {
                    clearInterval(countdownTimer);
                    alert("หมดเวลาทำรายการ สลากถูกนำกลับขึ้นแผง");
                    location.reload();
                }
            }, 1000);
        }
    </script>
</body>
</html>
